[package]
name = "everything-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "everything_engine"
path = "src/engine/mod.rs"

[[bin]]
name = "everything-app"
path = "src/main.rs"

[dependencies]
arboard = "3"
chrono = "0.4"
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", features = ["png"] }
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_UI_Shell",
    "Win32_System_IO"
] }

[build-dependencies]
winres = "0.1"
